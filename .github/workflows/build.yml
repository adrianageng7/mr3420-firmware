name: Build OpenWrt MR3420v2 Slim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 bzip2

      - name: Download & Extract ImageBuilder (OpenWrt Chaos Calmer 15.05.1)
        run: |
          wget https://archive.openwrt.org/chaos_calmer/15.05.1/ar71xx/generic/OpenWrt-ImageBuilder-15.05.1-ar71xx-generic.Linux-x86_64.tar.bz2
          tar -xjf OpenWrt-ImageBuilder-15.05.1-ar71xx-generic.Linux-x86_64.tar.bz2
          mv OpenWrt-ImageBuilder-15.05.1-ar71xx-generic.Linux-x86_64 ib

      - name: Fix Repository URLs (downloads → archive)
        run: |
          cd ib
          # Ganti semua URL lama downloads.openwrt.org → archive.openwrt.org
          sed -i 's|http://downloads.openwrt.org|https://archive.openwrt.org|g' repositories.conf
          # Tambahkan opsi untuk lewati verifikasi signature (karena key lama sudah expired)
          echo "option check_signature 0" >> repositories.conf
          cat repositories.conf

      - name: Pre-configure USB Tethering, AdGuard DNS & Wi-Fi
        run: |
          cd ib
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-setup
          #!/bin/sh
          uci set wireless.radio0.disabled='0'
          uci set wireless.@wifi-iface[0].ssid='MR3420-Adblock'
          uci set wireless.@wifi-iface[0].encryption='none'
          uci set network.wan=interface
          uci set network.wan.ifname='usb0'
          uci set network.wan.proto='dhcp'
          uci set network.wan.peerdns='0'
          uci add_list network.wan.dns='94.140.14.14'
          uci add_list network.wan.dns='94.140.15.15'
          uci commit
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-setup

      - name: Compile Firmware (.bin)
        run: |
          cd ib
          make image PROFILE="TLMR3420" \
            PACKAGES="luci kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether -ppp -ppp-mod-pppoe -kmod-ppp -kmod-pppoe -odhcp6c -ip6tables -kmod-ip6tables -kmod-ipv6" \
            FILES="files"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR3420v2-Firmware-Files
          path: ib/bin/ar71xx/generic/*tl-mr3420*sysupgrade.bin
