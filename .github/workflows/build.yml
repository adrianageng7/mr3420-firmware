name: Build OpenWrt MR3420v2 Slim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip

      - name: Download & Extract ImageBuilder (OpenWrt 18.06.9)
        run: |
          wget https://archive.openwrt.org/releases/18.06.9/targets/ar71xx/generic/openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64.tar.xz
          mv openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64 ib

      - name: Pre-configure USB Tethering, AdGuard DNS & Wi-Fi
        run: |
          cd ib
          mkdir -p files/etc/uci-defaults

          cat << 'EOF' > files/etc/uci-defaults/99-custom-setup
          #!/bin/sh

          # 1. Aktifkan Tema Modern Material secara default
          uci set luci.main.mediaurlbase='/luci-static/material'

          # 2. Aktifkan Wi-Fi otomatis
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.ssid='MR3420-Adblock'
          uci set wireless.default_radio0.encryption='none'

          # 3. Setup USB Tethering (usb0) sebagai WAN
          uci set network.wan=interface
          uci set network.wan.ifname='usb0'
          uci set network.wan.proto='dhcp'

          # 4. AdGuard DNS (Anti-Iklan di semua perangkat)
          uci set network.wan.peerdns='0'
          uci add_list network.wan.dns='94.140.14.14'
          uci add_list network.wan.dns='94.140.15.15'

          uci commit
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-setup

      - name: Compile Firmware (.bin)
        run: |
          cd ib
          # Menambahkan tema modern luci-theme-material
          make image PROFILE="TLMR3420V2" \
            PACKAGES="luci luci-theme-material kmod-usb2 kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether -ppp -ppp-mod-pppoe -kmod-ppp -kmod-pppoe -odhcp6c -ip6tables -kmod-ip6tables -kmod-ipv6" \
            FILES="files"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR3420v2-Firmware-Files
          path: ib/bin/targets/ar71xx/generic/*sysupgrade.bin
