name: Build OpenWrt MR3420v2 Slim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev \
            gawk git gettext libssl-dev xsltproc wget unzip python3

      - name: Download & Extract ImageBuilder (LEDE 17.01.7)
        run: |
          wget https://archive.openwrt.org/releases/17.01.7/targets/ar71xx/generic/lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64.tar.xz
          tar -xJf lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64.tar.xz
          mv lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64 ib

      - name: Fix Repository URLs
        run: |
          cd ib
          # Ganti URL lama ke archive yang benar
          sed -i 's|http://downloads.openwrt.org|https://archive.openwrt.org|g' repositories.conf
          sed -i 's|downloads.lede-project.org|archive.openwrt.org|g' repositories.conf
          # Nonaktifkan pengecekan GPG signature (key sudah expired)
          echo "option check_signature 0" >> repositories.conf
          echo "=== repositories.conf setelah patch ==="
          cat repositories.conf

      - name: Pre-configure USB Tethering, AdGuard DNS & Wi-Fi
        run: |
          cd ib
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-setup
          #!/bin/sh
          # Aktifkan Wi-Fi
          uci set wireless.radio0.disabled='0'
          uci set wireless.@wifi-iface[0].ssid='MR3420-Adblock'
          uci set wireless.@wifi-iface[0].encryption='none'
          # USB Tethering sebagai WAN
          uci set network.wan=interface
          uci set network.wan.ifname='usb0'
          uci set network.wan.proto='dhcp'
          # AdGuard DNS (Adblock)
          uci set network.wan.peerdns='0'
          uci add_list network.wan.dns='94.140.14.14'
          uci add_list network.wan.dns='94.140.15.15'
          uci commit
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-setup

      - name: Compile Firmware (.bin)
        run: |
          cd ib
          make image PROFILE="TLMR3420" \
            PACKAGES="luci kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether \
            -ppp -ppp-mod-pppoe -kmod-ppp -kmod-pppoe \
            -odhcp6c -ip6tables -kmod-ip6tables -kmod-ipv6" \
            FILES="files"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR3420v2-Firmware-17.01.7
          path: ib/bin/targets/ar71xx/generic/*tl-mr3420*sysupgrade.bin
